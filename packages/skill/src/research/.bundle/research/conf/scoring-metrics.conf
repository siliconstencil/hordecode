# research scoring metrics -- definitions for research-score.sh and research:tdd
# Format: METRIC_NAME DESCRIPTION THRESHOLD GOOD

# Per-phase scores
scope_score    "Brief quality: questions + scope + evidence policy"    0.3    0.7+
gather_score   "Source quality: count + diversity + grounding"         0.3    0.7+
verify_score   "Citation audit: existence + UNCORROBORATED rate"       0.3    0.7+
filter_score   "Compression: dedup + token budget adherence"           0.3    0.7+
synthesize_score "Report quality: structure + citations + gaps"       0.3    0.7+
decide_score   "Decision completeness: state + reasoning + milestone"  0.3    0.7+
eval_score     "QA traceability: claims -> evidence mapping"           0.3    0.7+

# Run-level metrics
average_score  "Mean of all phase scores"                              0.3    0.7+
min_score      "Lowest phase score (bottleneck indicator)"             0.3    0.5+
min_phase      "Phase with lowest score (focus area)"                  --     --

# Evidence metrics
source_count          "Total unique sources"                           3      10+
domain_diversity      "Unique domains / total sources"                 0.3    0.5+
uncorroborated_rate   "Uncorroborated claims / total claims"           --     <0.2
conflict_rate         "Conflict flags / total sources"                 --     <0.3
citation_accuracy     "Claims with evidence mapping / total claims"    0.5    0.8+

# Decision metrics
decision_yield        "Runs ending in ADOPT/DEFER/REJECT / total runs" 0.5    0.8+
token_efficiency      "Useful tokens / total tokens"                   0.3    0.5+

# S4 TDD + Vocab (conditional, code runs only)
# Anti-pattern gates for harness:tdd / research:tdd (research-score.sh + harness score helper)
# Each gate FAILs the eval phase when the placeholder remains.
tdd_seam_gate         "Seam-first checklist present and non-placeholder (interface/seam defined before slice)"  --   present
tdd_slice_gate        "One-slice scope declared (single seam, single behavior)"                               --   present
tdd_stub_gate         "No stub/TODO passthrough (no unimplemented seams)"                                    --   0
# Vocab reference: plan templates carry deep-module glossary fragment (research/pipeline/templates/glossary.md)
# Handoff reference: handoff redaction checklist (research/pipeline/templates/handoff-checklist.md)
