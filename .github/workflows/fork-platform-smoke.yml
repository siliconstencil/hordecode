name: fork-platform-smoke

# Builds the native platform package on real macOS and Windows runners, then runs the
# fresh-install checks that the Linux release machine cannot run for those targets:
# version, headless server, the no-provider message, and an npm install of the packed
# meta + platform packages. Manual trigger only (macOS minutes are expensive).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version to rehearse (must match packages/opencode/package.json)"
        required: true
        default: "0.1.1"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            bin: hordecode
          - os: macos-15-intel
            target: darwin-x64
            bin: hordecode
          - os: windows-latest
            target: windows-x64
            bin: hordecode.exe
          - os: windows-11-arm
            target: windows-arm64
            bin: hordecode.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install
      - name: Build platform package
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
        run: bun script/build.ts --target ${{ matrix.target }}
      - name: Version
        working-directory: packages/opencode
        run: ./dist/hordecode-${{ matrix.target }}/bin/${{ matrix.bin }} --version
      - name: Fresh user checks on the built binary
        working-directory: packages/opencode
        env:
          HORDECODE_HOME: ${{ runner.temp }}/hordecode-home
        run: |
          set -u
          BIN="$PWD/dist/hordecode-${{ matrix.target }}/bin/${{ matrix.bin }}"
          mkdir -p "$HORDECODE_HOME" "${{ runner.temp }}/proj"
          cd "${{ runner.temp }}/proj"
          "$BIN" serve --port 4097 --hostname 127.0.0.1 > serve.log 2>&1 &
          SERVE=$!
          n=0
          until curl -s -o /dev/null --max-time 2 http://127.0.0.1:4097/doc || [ $n -ge 60 ]; do sleep 1; n=$((n+1)); done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:4097/doc)
          echo "serve /doc http=$code after ${n}s"
          providers=$(curl -s --max-time 10 http://127.0.0.1:4097/config/providers)
          echo "providers: $providers"
          kill $SERVE || true
          [ "$code" = "200" ] || { echo "serve did not answer"; cat serve.log; exit 1; }
          set +e
          out=$("$BIN" run "say hi" 2>&1)
          rc=$?
          set -e
          echo "run exit=$rc"
          echo "$out" | tail -3
          echo "$out" | grep -q "No provider configured" || { echo "expected the no-provider message"; exit 1; }
          [ "$rc" -ne 0 ] || { echo "run must fail without a provider"; exit 1; }
      - name: Pack meta and platform packages (rehearsal)
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          HORDECODE_PUBLISH_DRY_RUN: "1"
          HORDECODE_PUBLISH_DRY_RUN_TARGETS: ${{ matrix.target }}
        run: bun script/publish.ts
      - name: npm install from the packed tarballs
        working-directory: packages/opencode
        env:
          HORDECODE_HOME: ${{ runner.temp }}/hordecode-home2
        run: |
          set -u
          TEMP_DIR="${{ runner.temp }}"
          # Git Bash keeps "D:\a\_temp" verbatim; npm's shell shim then resolves a broken path.
          if [ "$RUNNER_OS" = "Windows" ]; then TEMP_DIR="$(cygpath -m "$TEMP_DIR")"; fi
          PREFIX="$TEMP_DIR/npm-prefix"
          mkdir -p "$PREFIX" "$HORDECODE_HOME"
          npm install -g --prefix "$PREFIX" ./dist/hordecode-${{ matrix.target }}/hordecode-${{ matrix.target }}-${{ inputs.version }}.tgz ./dist/hordecode/hordecode-${{ inputs.version }}.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="$(cygpath -u "$PREFIX"):$PATH"; else export PATH="$PREFIX/bin:$PATH"; fi
          which hordecode horde
          hordecode --version
          horde --version
          cd "$TEMP_DIR"
          hordecode serve --port 4098 --hostname 127.0.0.1 > serve2.log 2>&1 &
          SERVE=$!
          n=0
          until curl -s -o /dev/null --max-time 2 http://127.0.0.1:4098/doc || [ $n -ge 60 ]; do sleep 1; n=$((n+1)); done
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:4098/doc)
          echo "installed serve /doc http=$code after ${n}s"
          kill $SERVE || true
          [ "$code" = "200" ] || { cat serve2.log; exit 1; }
