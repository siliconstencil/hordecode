name: release
on:
  push:
    tags: ["v*"]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: typecheck inbox
        run: bun run typecheck
        working-directory: packages/inbox
      - name: typecheck core
        run: bun run typecheck
        working-directory: packages/core
      - name: check orphaned tables
        run: bun run check:orphaned-tables
        working-directory: packages/core
      - name: typecheck opencode
        run: bun run typecheck
        working-directory: packages/opencode
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: typecheck supervisor
        run: bun run typecheck
        working-directory: packages/supervisor
